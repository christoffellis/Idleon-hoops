[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idleon-hoops"
version = "0.1.0"
description = "Beat the Idleon hoops minigame by fitting its physics from screen detection (OpenCV + regression)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "mss",
    "pyautogui",
    "pynput",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]
animations = ["manim>=0.18"]

[project.scripts]
hoops-calibrate = "hoops_bot.calibrate:main"
hoops-record = "hoops_bot.record:main"
hoops-fit = "hoops_bot.fit:main"
hoops-aim = "hoops_bot.aim:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
